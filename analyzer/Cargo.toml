[package]
name = "tunekore-analyzer"
version = "0.1.1"
description = "tuneKore's Analyzer: decode a song, split it into stems in the worker, check and export them"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "aiff", "flac", "mp3", "aac", "alac", "isomp4", "pcm"] }
hound = "3.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
