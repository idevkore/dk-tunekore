[package]
name = "tunekore-engine"
version = "0.1.17"
description = "tuneKore's audio engine"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cpal = "0.18.2"
rtrb = "0.4.0"
rubato = "5.0.1"
serde = { version = "1", features = ["derive"] }
# RealtimeSanitizer: inert unless built with RTSAN_ENABLE=1. Without the
# default `prebuilt-libs` feature it builds its runtime from LLVM's own
# source instead of downloading a binary.
rtsan-standalone = { version = "0.3.0", default-features = false }
