[workspace]
resolver = "2"
members = ["engine", "analyzer", "src-tauri"]

[workspace.package]
edition = "2021"
rust-version = "1.90"
license = "UNLICENSED"
publish = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Audio and DSP code runs too slowly unoptimized to test by ear.
[profile.dev.package.tunekore-engine]
opt-level = 2

# The Analyzer's tempo and key detection and its tests run FFTs over minutes of audio.
[profile.dev.package.tunekore-analyzer]
opt-level = 2

[profile.dev.package.rustfft]
opt-level = 2
