[package]
name = "tunekore"
version = "0.1.0"
description = "tuneKore: a lightweight DAW by devKore"
authors = ["devKore"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "tunekore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tunekore-engine = { path = "../engine" }
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "2.8.3"
tunekore-analyzer = { version = "0.1.0", path = "../analyzer" }
serde_json = "1.0.154"
