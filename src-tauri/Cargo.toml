[package]
name = "musikore"
version = "0.1.0"
description = "musiKore: a lightweight DAW by devKore"
authors = ["devKore"]
edition = "2021"
rust-version = "1.90"
license = "UNLICENSED"
publish = false

[lib]
name = "musikore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
cmake = "0.1"

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
