[package]
name = "tunekore-plugins"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "UNLICENSED"
publish = false
description = "tuneKore's plugin host: scans, loads and runs VST3 plugins behind one Plugin trait"
build = "build.rs"

# Its own workspace until the plugins-in-the-app PR joins it to the root one.
[workspace]
resolver = "2"
exclude = ["third_party", "tests/fixture"]

[dependencies]
libloading = "0.9"
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"
vst3 = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSView", "NSWindow", "NSGraphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString"] }

[build-dependencies]
cc = "1"
