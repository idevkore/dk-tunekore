[package]
name = "tunekore-plugins"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "UNLICENSED"
publish = false
description = "tuneKore's plugin host: scans, loads and runs VST3 plugins behind one Plugin trait"
build = "build.rs"

[dependencies]
crossbeam-queue = "0.3"
libloading = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"
vst3 = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSView", "NSWindow", "NSGraphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString"] }

[build-dependencies]
cc = "1"

# Examples and tests drive an AppKit event loop.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSResponder", "NSRunningApplication", "NSView", "NSWindow", "NSGraphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate", "NSGeometry", "NSObjCRuntime", "NSRunLoop", "NSString"] }

[[test]]
name = "editor_main_thread"
harness = false

[[test]]
name = "installed_plugins"
harness = false
