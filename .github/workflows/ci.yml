name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS is the shipping platform: full build, tests and the .app bundle.
  # Windows and Linux only have to compile and link until Phases 8 and 9.
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Engine (C++20): configure, build, test
        run: |
          cmake -S engine -B engine-build -DCMAKE_BUILD_TYPE=Release
          cmake --build engine-build --config Release
          ctest --test-dir engine-build -C Release --output-on-failure

      - run: npm ci
      - run: npm run typecheck
        if: runner.os == 'macOS'
      - name: Licences
        if: runner.os == 'macOS'
        run: npm run licenses
      - run: npm run build

      - name: Rust tests
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build the app (compiles and links the engine)
        if: runner.os != 'macOS'
        working-directory: src-tauri
        run: cargo build --locked

      - name: Build the macOS app bundle
        if: runner.os == 'macOS'
        run: npx tauri build --bundles app

      - uses: actions/upload-artifact@v5
        if: runner.os == 'macOS'
        with:
          name: musiKore-macos-app
          path: src-tauri/target/release/bundle/macos/musiKore.app
          retention-days: 7
