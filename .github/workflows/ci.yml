name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS is the shipping platform: full build, tests and the .app bundle.
  # Windows and Linux only have to compile and link until Phases 8 and 9.
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libasound2-dev: cpal's ALSA backend
          sudo apt-get install -y build-essential pkg-config libasound2-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      # The Analyzer's stem worker (Python). Its tests need no model weights;
      # with it set up, the Rust worker tests below run too.
      - uses: astral-sh/setup-uv@v10.3.2
        if: runner.os == 'macOS'
      - name: Stem worker tests
        if: runner.os == 'macOS'
        working-directory: stems
        run: |
          uv sync --frozen
          uv run --frozen pytest -q tests

      - run: npm ci
      - run: npm run version:check
      - run: npm run typecheck
        if: runner.os == 'macOS'
      - name: Licences
        if: runner.os == 'macOS'
        run: npm run licenses
      - run: npm run build

      - name: Engine and Analyzer tests
        run: cargo test -p tunekore-engine -p tunekore-analyzer --locked

      - name: All Rust tests
        if: runner.os == 'macOS'
        run: cargo test --workspace --locked

      # The engine's tests again with RealtimeSanitizer built in: any
      # allocation, free, lock or blocking call on the audio thread aborts
      # them. Without a cached runtime, rtsan-standalone builds it from
      # LLVM's source (git, cmake and make are on the runner). The runtime is
      # copied out and cached before the tests run, so a failure later in
      # the job doesn't throw the build away.
      - name: RTSan runtime (restore)
        id: rtsan-cache
        if: runner.os == 'macOS'
        uses: actions/cache/restore@v4
        with:
          path: .rtsan
          key: rtsan-0.3.0-llvmorg-20.1.1-${{ runner.os }}-${{ runner.arch }}
      - name: RTSan runtime (build)
        if: runner.os == 'macOS' && steps.rtsan-cache.outputs.cache-hit != 'true'
        env:
          RTSAN_ENABLE: "1"
        run: |
          cargo test -p tunekore-engine --locked --no-run
          mkdir -p .rtsan
          cp target/debug/build/rtsan-standalone-sys-*/out/libclang_rt.rtsan_osx_dynamic.dylib .rtsan/
      - name: RTSan runtime (save)
        if: runner.os == 'macOS' && steps.rtsan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .rtsan
          key: rtsan-0.3.0-llvmorg-20.1.1-${{ runner.os }}-${{ runner.arch }}
      - name: Engine tests under RealtimeSanitizer
        if: runner.os == 'macOS'
        env:
          RTSAN_ENABLE: "1"
        run: RTSAN_LIB_PATH="$PWD/.rtsan/libclang_rt.rtsan_osx_dynamic.dylib" cargo test -p tunekore-engine --locked

      - name: Build the app
        if: runner.os != 'macOS'
        run: cargo build --workspace --locked

      - name: Build the macOS app bundle
        if: runner.os == 'macOS'
        run: npx tauri build --bundles app

      - uses: actions/upload-artifact@v5
        if: runner.os == 'macOS'
        with:
          name: tuneKore-macos-app
          path: target/release/bundle/macos/tuneKore.app
          retention-days: 7
